name: Release loembyA

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release-for-github:
    name: Release standard ARM64 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate release version
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            printf '::error::Invalid release tag\n'
            exit 1
          fi

          name_pattern='^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$'
          code_pattern='^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$'
          version_names=()
          version_codes=()
          while IFS= read -r line; do
            if [[ "$line" =~ $name_pattern ]]; then
              version_names+=("${BASH_REMATCH[1]}")
            fi
            if [[ "$line" =~ $code_pattern ]]; then
              version_codes+=("${BASH_REMATCH[1]}")
            fi
          done < "$GITHUB_WORKSPACE/app/build.gradle.kts"

          if [[ ${#version_names[@]} -ne 1 || ${#version_codes[@]} -ne 1 ]]; then
            printf '::error::Expected one base versionName and versionCode in app/build.gradle.kts\n'
            exit 1
          fi
          version_name="${version_names[0]}"
          if [[ "${VERSION_TAG#v}" != "$version_name" ]]; then
            printf '::error::Release tag does not match the Gradle versionName\n'
            exit 1
          fi

          prerelease=false
          if [[ "$version_name" == *-* ]]; then
            prerelease=true
          fi
          {
            printf 'VERSION_TAG=%s\n' "$VERSION_TAG"
            printf 'VERSION_NAME=%s\n' "$version_name"
            printf 'APK_VERSION_CODE=%s\n' "$((10#${version_codes[0]} * 10 + 2))"
            printf 'APK_FILENAME=loembyA-arm64-v8a-%s.apk\n' "$VERSION_TAG"
            printf 'IS_PRERELEASE=%s\n' "$prerelease"
          } >> "$GITHUB_ENV"

      - name: Check signing configuration
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEYSTORE SIGNING_KEY_ALIAS SIGNING_STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Missing signing secret: %s\n' "$name"
              exit 1
            fi
          done

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            settings.gradle.kts
            build.gradle.kts
            app/build.gradle.kts
            gradle.properties
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install project SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'

      - name: Build standard ARM64 release
        run: sh "$GITHUB_WORKSPACE/gradlew" -p "$GITHUB_WORKSPACE" :app:assembleStandardRelease -Pabi=arm64-v8a

      - name: Sign and verify release APK
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned_apk="$GITHUB_WORKSPACE/app/build/outputs/apk/standard/release/app-standard-arm64-v8a-release-unsigned.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          if [[ ! -f "$unsigned_apk" ]]; then
            printf '::error::Expected unsigned standard ARM64 APK was not found\n'
            exit 1
          fi

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/loembya-signing.XXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          release_dir=$(mktemp -d "$RUNNER_TEMP/loembya-release.XXXXXX")
          signed_apk="$release_dir/$APK_FILENAME"
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$signing_dir/release.keystore"
          "$tools/zipalign" -P 16 4 "$unsigned_apk" "$signing_dir/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$signing_dir/release.keystore" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$signed_apk" \
            "$signing_dir/aligned.apk"
          "$tools/apksigner" verify "$signed_apk"
          "$tools/zipalign" -c -P 16 4 "$signed_apk"

          badging=$("$tools/aapt" dump badging "$signed_apk")
          package_info=''
          native_code=''
          while IFS= read -r line; do
            case "$line" in
              package:*) package_info="$line" ;;
              native-code:*) native_code="$line" ;;
            esac
          done <<< "$badging"
          expected_package="package: name='com.github.npcdw.loembya' versionCode='$APK_VERSION_CODE' versionName='$VERSION_NAME'"
          if [[ "$package_info" != "$expected_package"* || "$native_code" != "native-code: 'arm64-v8a'" ]]; then
            printf '::error::APK package, version or ABI does not match this release\n'
            exit 1
          fi

          read -r checksum _ < <(sha256sum "$signed_apk")
          printf '%s  %s\n' "$checksum" "$APK_FILENAME" > "$release_dir/SHA256SUMS"
          {
            printf 'RELEASE_DIR=%s\n' "$release_dir"
            printf 'APK_SHA256=%s\n' "$checksum"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: loembyA ${{ env.VERSION_TAG }}
          body: |
            ## loembyA ${{ env.VERSION_TAG }}

            Android companion to the loemby desktop Emby player.

            - Variant: standard
            - Architecture: arm64-v8a (Android 8.0 or newer)
            - Application ID: `com.github.npcdw.loembya`
            - Version: `${{ env.VERSION_NAME }}` (versionCode `${{ env.APK_VERSION_CODE }}`)

            ### SHA-256

            | File | SHA-256 |
            | ---- | ------- |
            | `${{ env.APK_FILENAME }}` | `${{ env.APK_SHA256 }}` |

            Download both attachments and run `sha256sum -c SHA256SUMS` to verify the APK.
          files: |
            ${{ env.RELEASE_DIR }}/${{ env.APK_FILENAME }}
            ${{ env.RELEASE_DIR }}/SHA256SUMS
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
